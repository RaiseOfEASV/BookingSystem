services:

  # ── SQL Server ──────────────────────────────────────────────────────────────
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: booking-system-db
    env_file: .env
    environment:
      SA_PASSWORD: ${SA_PASSWORD}
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
    ports:
      - "1434:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P $$SA_PASSWORD -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ── Booking Service ─────────────────────────────────────────────────────────
  booking-api: &booking-api
    build:
      context: .
      dockerfile: apps/BookingService/Dockerfile
    container_name: booking-api
    env_file: .env
    expose:
      - "8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Server=sqlserver;Database=BookingServiceDb;User Id=sa;Password=${SA_PASSWORD};TrustServerCertificate=True;"
    depends_on:
      sqlserver:
        condition: service_healthy
    networks:
      - bookingnetwork

  # ── Inventory Service ───────────────────────────────────────────────────────
  inventory-api: &inventory-api
    build:
      context: .
      dockerfile: apps/InventoryService/Dockerfile
    container_name: inventory-api
    env_file: .env
    expose:
      - "8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Server=sqlserver;Database=InventoryServiceDb;User Id=sa;Password=${SA_PASSWORD};TrustServerCertificate=True;"
    depends_on:
      sqlserver:
        condition: service_healthy
    networks:
      - bookingnetwork

  # ── User Service ────────────────────────────────────────────────────────────
  user-api: &user-api
    build:
      context: .
      dockerfile: apps/UserService/Dockerfile
    container_name: user-api
    env_file: .env
    expose:
      - "8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Server=sqlserver;Database=UserServiceDb;User Id=sa;Password=${SA_PASSWORD};TrustServerCertificate=True;"
    depends_on:
      sqlserver:
        condition: service_healthy
    networks:
      - bookingnetwork

  # ── Nginx reverse proxy ─────────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    ports:
      - "5000:80"
    volumes:
      - ./nginx/:/etc/nginx/conf.d/
    depends_on:
      - booking-api
      - inventory-api
      - user-api
    networks:
      - bookingnetwork

networks:
  bookingnetwork:
    external: true

volumes:
  sqlserver-data:
