services:

  # ── SQL Server ──────────────────────────────────────────────────────────────
  booking-db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: booking-db
    env_file: .env
    environment:
      SA_PASSWORD: ${SA_PASSWORD}
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
    ports:
      - "1434:1433"          # host 1434 → container 1433 (avoids conflict with other DBs)
    volumes:
      - booking-db-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P $$SA_PASSWORD -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ── Nginx ───────────────────────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    ports:
      - "5001:80"
    volumes:
      - ./nginx/:/etc/nginx/conf.d/
    depends_on:
      - booking-api-1
    networks:
      - bookingnetwork

  # ── Booking API ─────────────────────────────────────────────────────────────
  booking-api-1: &api
    build:
      context: ../..
      dockerfile: apps/BookingService/Dockerfile
    env_file: .env
    expose:
      - "8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Server=booking-db;Database=${BOOKING_DB};User Id=sa;Password=${SA_PASSWORD};TrustServerCertificate=True;"
    depends_on:
      booking-db:
        condition: service_healthy
    networks:
      - bookingnetwork
  booking-api-2:
    <<: *api

networks:
  bookingnetwork:
    external: true

volumes:
  booking-db-data:
