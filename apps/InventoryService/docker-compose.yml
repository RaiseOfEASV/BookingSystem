services:

  # ── SQL Server ──────────────────────────────────────────────────────────────
  inventory-db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: inventory-db
    env_file: .env
    environment:
      SA_PASSWORD: ${SA_PASSWORD}
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
    ports:
      - "1435:1433"         
    volumes:
      - inventory-db-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P $$SA_PASSWORD -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ── Nginx ───────────────────────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    ports:
      - "5002:80"
    volumes:
      - ./nginx/:/etc/nginx/conf.d/
    depends_on:
      - inventory-api-1
    networks:
      - default
      - services

  # ── Inventory API ───────────────────────────────────────────────────────────
  inventory-api-1: &api
    build:
      context: ../..
      dockerfile: apps/InventoryService/Dockerfile
    env_file: .env
    expose:
      - "8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Server=inventory-db;Database=${INVENTORY_DB};User Id=sa;Password=${SA_PASSWORD};TrustServerCertificate=True;"
    depends_on:
      inventory-db:
        condition: service_healthy
    networks:
      - default
      - services
  inventory-api-2:
    <<: *api

networks:
  services:
    external: true
    name: bookingsystem-services

volumes:
  inventory-db-data:
